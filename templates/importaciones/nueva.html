{% extends 'base.html' %}
{% block title %}Nueva Importación{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2><i class="bi bi-plus-circle"></i> Nueva Importación</h2>
  <a href="{{ url_for('importaciones_lista') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Volver
  </a>
</div>

<form method="post" id="formImportacion">
  <div class="card shadow-sm mb-4">
    <div class="card-header"><h5 class="mb-0">Información General</h5></div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">N° Referencia <span class="text-danger">*</span></label>
          <input type="text" name="numero_referencia" class="form-control" required
                 placeholder="IMP-2024-XXX" value="{{ request.form.get('numero_referencia', '') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Proveedor <span class="text-danger">*</span></label>
          <select name="proveedor_id" class="form-select" required>
            <option value="">Seleccionar…</option>
            {% for p in proveedores %}
            <option value="{{ p.id }}" {% if request.form.get('proveedor_id')|int == p.id %}selected{% endif %}>
              {{ p.nombre }} ({{ p.pais }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Estado <span class="text-danger">*</span></label>
          <select name="estado" class="form-select" required>
            {% for e in estados %}
            <option value="{{ e }}" {% if request.form.get('estado', 'Ordenado') == e %}selected{% endif %}>{{ e }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Fecha de Orden <span class="text-danger">*</span></label>
          <input type="date" name="fecha_orden" class="form-control" required
                 value="{{ request.form.get('fecha_orden', '') }}">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Fecha Est. Llegada</label>
          <input type="date" name="fecha_estimada_llegada" class="form-control"
                 value="{{ request.form.get('fecha_estimada_llegada', '') }}">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Fecha de Llegada</label>
          <input type="date" name="fecha_llegada" class="form-control"
                 value="{{ request.form.get('fecha_llegada', '') }}">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Moneda</label>
          <select name="moneda" class="form-select">
            {% for m in monedas %}
            <option value="{{ m }}" {% if request.form.get('moneda', 'USD') == m %}selected{% endif %}>{{ m }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Notas</label>
          <textarea name="notas" class="form-control" rows="3">{{ request.form.get('notas', '') }}</textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Line items -->
  <div class="card shadow-sm mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Artículos de la Importación</h5>
      <button type="button" class="btn btn-success btn-sm" id="btnAgregarItem">
        <i class="bi bi-plus"></i> Agregar Artículo
      </button>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0" id="tablaItems">
          <thead class="table-light">
            <tr>
              <th style="min-width:220px">Producto</th>
              <th style="min-width:120px">Cantidad</th>
              <th style="min-width:140px">Precio Unitario</th>
              <th style="min-width:130px" class="text-end">Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <!-- rows injected by JS -->
          </tbody>
          <tfoot>
            <tr class="table-light fw-bold">
              <td colspan="3" class="text-end">Total:</td>
              <td class="text-end" id="totalGlobal">0.00</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar Importación</button>
    <a href="{{ url_for('importaciones_lista') }}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script>
// Initialize with one empty row on page load
document.addEventListener('DOMContentLoaded', function() {
  agregarFila();
});
</script>
{% endblock %}
